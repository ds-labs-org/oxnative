name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ["", "vault"]
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable && rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo build --all-targets --features "${{ matrix.features }}"
      - run: cargo clippy --all-targets --features "${{ matrix.features }}" -- -D warnings -D clippy::all
      - run: cargo test --features "${{ matrix.features }}"
      - run: cargo doc --no-deps --features "${{ matrix.features }}"
        env:
          RUSTDOCFLAGS: -D warnings
